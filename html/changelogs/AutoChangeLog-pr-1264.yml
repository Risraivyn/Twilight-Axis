author: "PatapoIIIa"
delete-after: True
changes:
  - bugfix: "Вампиры больше не могут телепортировать себя (Presence) сквозь стены при активном Auspex"
  - bugfix: "Дар Берсерка теперь срабатывает и после мгновенной смерти от одиночного удара"
  - bugfix: "Способность Quietus «Взор Ваала» (T4) больше не была полностью нерабочей"
  - bugfix: "Dagon's Call нельзя обратить на самого себя"
  - bugfix: "Устранены двойной урон и дублирующееся сообщение от яда Quietus (Vitae Acid)"
  - bugfix: "Вампиры снова видят HUD-иконку антагониста друг у друга"
  - bugfix: "Резиденты с даром «Житель» снова получают грамоту и место в таверне"
  - bugfix: "Призванные существа (доспехи мага и т.п.) больше не могут стать «женихом/невестой» в семейной системе"
  - bugfix: "Взаимный отказ от пары в семейной системе больше не сводит тех же двух людей повторно"
  - bugfix: "Устранены зависания подтверждения пары в семейной системе (иконка/блокировка навсегда, автопринятие за отключившегося)"
  - balance: "Rockhill Masquerade — шанс появления зависит от населённости раунда, добавлен таймер выбора клана"
  - qol: "Диалог ожидания «избранного» в семье считает реальное время, а не число попыток"
  - qol: "Иконка выбора клана у вретчей/ликеров с принудительным кланом больше не висит без нужды"
  - qol: "Закрытие меню выбора клана без выбора больше не форсит клан по умолчанию"
  - admin: "Логи семейной системы переведены в отдельный ss_family.log с переключаемым подробным режимом"